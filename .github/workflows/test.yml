name: Test SSH Key Sync
# This workflow performs comprehensive testing of the SSH key sync script.
# The workflow itself only provisions CI fixtures (packages, test users); all
# test assertions live in .github/scripts/*.sh. Add new test cases there —
# no workflow changes are needed unless a test requires a new fixture.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get install -y diffutils

      - name: Make scripts executable
        run: chmod +x sync-ssh-keys.sh .github/scripts/functional-tests.sh

      - name: Create test users
        run: |
          sudo useradd -m testuser1 || true
          sudo useradd -m testuser2 || true
          sudo useradd -m testuser3 || true

      - name: Run functional tests
        run: .github/scripts/functional-tests.sh

      - name: Cleanup test environment
        if: always()
        run: |
          git checkout users.conf 2>/dev/null || true
          sudo userdel -f testuser1 2>/dev/null || true
          sudo userdel -f testuser2 2>/dev/null || true
          sudo userdel -f testuser3 2>/dev/null || true

  integration-test:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get install -y diffutils

      - name: Make scripts executable
        run: chmod +x sync-ssh-keys.sh .github/scripts/integration-tests.sh

      - name: Create integration test users
        run: |
          sudo useradd -m integrationuser
          sudo useradd -m symlinkuser

      - name: Run integration tests
        run: .github/scripts/integration-tests.sh

      - name: Cleanup integration test
        if: always()
        run: |
          git checkout users.conf 2>/dev/null || true
          sudo userdel -rf integrationuser 2>/dev/null || true
          sudo userdel -rf symlinkuser 2>/dev/null || true
