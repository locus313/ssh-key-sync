name: CI

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '.github/instructions/**'
      - '.github/skills/**'
      - '.github/agents/**'
      - '**/*.md'
      - 'LICENSE'
  push:
    branches:
      - main
    paths-ignore:
      - '.github/instructions/**'
      - '.github/skills/**'
      - '.github/agents/**'
      - '**/*.md'
      - 'LICENSE'

permissions:
  contents: read

# Cancel superseded runs so rapid pushes to the same PR/branch don't burn
# minutes on commits that are no longer relevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Run all individual checks in parallel
  lint:
    uses: ./.github/workflows/lint.yml

  version-check:
    uses: ./.github/workflows/check-version.yml
    if: github.event_name == 'pull_request'

  test:
    uses: ./.github/workflows/test.yml

  # Final status check
  ci-success:
    runs-on: ubuntu-latest
    needs: [lint, test, version-check]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "Lint job failed"
            exit 1
          fi

          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Test job failed"
            exit 1
          fi

          if [[ "${{ github.event_name }}" == "pull_request" && "${{ needs.version-check.result }}" != "success" ]]; then
            echo "Version check job failed"
            exit 1
          fi

          echo "All CI checks passed!"
